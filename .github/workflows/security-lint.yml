# ==============================================================================
# Automated Infrastructure-as-Code Security & Quality Linter
# ==============================================================================

name: "Terraform Security & Lint Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-devsecops:
    name: Python Code & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Run Python Unit Tests
        run: |
          python3 -m unittest discover -s tests

      - name: Install Python DevSecOps Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Run Ruff Linter & Formatter Check
        run: |
          echo "::group::Ruff Code Quality Inspection"
          ruff check scripts/
          ruff format --check scripts/
          ruff check tests/
          ruff format --check tests/
          echo "::endgroup::"

      - name: Run Bandit SAST Security Scan
        run: |
          echo "::group::Bandit Static Application Security Testing"
          bandit -r scripts/ -ll -ii
          bandit -r tests/ -ll -ii
          echo "::endgroup::"

  terraform-lint:
    name: "TFLint & Format Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Initialize Terraform (Validate Syntax & Providers)
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint Security & Best Practice Analysis
        run: |
          cd terraform
          tflint --init
          tflint --format=compact
      
  checkov:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          fail_on_severity: HIGH
          soft_fail: false
